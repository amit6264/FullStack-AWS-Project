name: Build & Push Frontend + Backend to ECR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1          # change if needed
      FRONTEND_REPO: frontend
      BACKEND_REPO: backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------
    # Configure AWS Credentials
    # -------------------------
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # -------------------------
    # Create ECR repos (Auto)
    # -------------------------
    - name: Create ECR repositories
      run: |
        aws ecr describe-repositories --repository-names $FRONTEND_REPO || \
        aws ecr create-repository --repository-name $FRONTEND_REPO
        
        aws ecr describe-repositories --repository-names $BACKEND_REPO || \
        aws ecr create-repository --repository-name $BACKEND_REPO

    # -------------------------
    # Login to Amazon ECR
    # -------------------------
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # -------------------------
    # Build Backend Image
    # -------------------------
    - name: Build Backend Docker Image
      run: |
        docker build -t $BACKEND_REPO ./backend

    - name: Tag Backend Image
      run: |
        docker tag $BACKEND_REPO:latest \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$BACKEND_REPO:latest

    - name: Push Backend Image
      run: |
        docker push \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$BACKEND_REPO:latest

    # -------------------------
    # Build Frontend Image
    # -------------------------
    - name: Build Frontend Docker Image
      run: |
        docker build -t $FRONTEND_REPO ./client

    - name: Tag Frontend Image
      run: |
        docker tag $FRONTEND_REPO:latest \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$FRONTEND_REPO:latest

    - name: Push Frontend Image
      run: |
        docker push \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$FRONTEND_REPO:latest
